  .page-intro{
    max-width:600px;
    margin:26px auto 0;
    text-align:center;
    font-size:13px;
    line-height:1.8;
    color:var(--text-body);
  }

  .comm-section{
    margin-top:80px;
  }
  .comm-section:first-of-type{
    margin-top:50px;
  }

  .flyer-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:24px;
    max-width:1200px;
    margin:28px auto 0;
  }
  .flyer-grid img{
    width:100%;
    height:auto;
    display:block;
    border-radius:8px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,.6);
  }

  .logofolio-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:16px;
    max-width:1100px;
    margin:28px auto 0;
  }
  .logofolio-grid .logo-card{
    aspect-ratio:1;
    background:var(--card-bg);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .logofolio-grid img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
  }

  @media (max-width:700px){
    .flyer-grid{ grid-template-columns:1fr; }
    .logofolio-grid{ grid-template-columns:repeat(2, 1fr); }
  }
